events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    upstream gastroflow_backend { server gastroflow-app:5000; }

    # TLS must be terminated by the hosting load balancer/CDN or by a dedicated
    # certificate-enabled proxy. Do not expose port 443 until certificates exist.
    server {
        listen 80;
        server_name _;
        client_max_body_size 10m;

        location /api/stream/ {
            proxy_pass http://gastroflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Accel-Buffering no;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        location / {
            proxy_pass http://gastroflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

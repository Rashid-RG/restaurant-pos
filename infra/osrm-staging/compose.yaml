# Staging only. This does not download or preprocess OpenStreetMap data.
# Place a prepared MLD dataset (region.osrm and its companion files) under ./data.
services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: ["osrm-routed","--algorithm","mld","--port","5000","/data/region.osrm"]
    volumes:
      - ./data:/data:ro
    expose:
      - "5000"
    restart: unless-stopped
  gateway:
    build:
      context: .
      dockerfile: gateway.Dockerfile
    environment:
      PORT: "8080"
      OSRM_INTERNAL_URL: "http://osrm:5000"
      GASTROFLOW_ROUTING_KEY: "${GASTROFLOW_ROUTING_KEY:?Set a strong key in private environment}"
    depends_on:
      - osrm
    # Do not expose publicly without an HTTPS reverse proxy + rate limits.
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

name: GastroFlow Food Android signed staging APK

# Explicit release approval. Do not publish on every code push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gastrofood-staging-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    if: github.ref == 'refs/heads/codex/production-readiness'
    name: Build permanently signed GastroFlow Food Staging APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_NATIVE_API_ORIGIN: https://gastroflow-staging.onrender.com
    steps:
      - name: Check out the approved branch
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub Ubuntu runners already provide Android SDK command-line tools.
      # Do not use android-actions/setup-android@v3 here: it invokes
      # "sdkmanager tools", a removed package, and fails before compilation.
      - name: Install Android API 36 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "Android SDK: ${ANDROID_HOME:-not-set}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then echo "::error::Android SDK manager not found in $SDK_ROOT"; exit 1; fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Record protected POS lockfile checksum
        run: sha256sum package-lock.json > "$RUNNER_TEMP/pos-lock.sha256"

      - name: Install root dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Install isolated customer native dependencies
        working-directory: apps/customer-web
        run: npm ci --include=dev --no-audit --no-fund

      - name: Audit native customer release boundaries
        run: |
          node scripts/check-food-native-release-boundary.mjs
          node scripts/verify-food-native-lock.mjs apps/customer-web/package.json apps/customer-web/package-lock.json

      - name: Compile customer native interface and validate API target
        run: |
          npm run customer:native:build
          test -s apps/customer-web/dist/index.html
          if grep -R -q 'http://localhost:5000' apps/customer-web/dist/assets; then
            echo 'BLOCKED: native bundle references development API' >&2
            exit 1
          fi

      - name: Sync customer Android resources only
        working-directory: apps/customer-web
        run: |
          npm run native:sync:android
          npm run native:harden:android

      - name: Check permanent staging signing credentials
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FOOD_STAGING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.FOOD_STAGING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.FOOD_STAGING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FOOD_STAGING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_B64 STORE_PASS KEY_PASS KEY_ALIAS; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing $variable staging signing secret. See docs/GASTROFOOD_ANDROID_STAGING_RELEASE.md"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/gastrofood-signing"
          chmod 700 "$RUNNER_TEMP/gastrofood-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gastrofood-signing/staging.jks"
          chmod 600 "$RUNNER_TEMP/gastrofood-signing/staging.jks"
          test -s "$RUNNER_TEMP/gastrofood-signing/staging.jks"

      - name: Build separately installable signed staging APK
        working-directory: apps/customer-web/android
        env:
          FOOD_STAGING_KEYSTORE_PATH: ${{ runner.temp }}/gastrofood-signing/staging.jks
          FOOD_STAGING_STORE_PASSWORD: ${{ secrets.FOOD_STAGING_STORE_PASSWORD }}
          FOOD_STAGING_KEY_ALIAS: ${{ secrets.FOOD_STAGING_KEY_ALIAS }}
          FOOD_STAGING_KEY_PASSWORD: ${{ secrets.FOOD_STAGING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon --stacktrace --console=plain \
            -PfoodStagingVersionCode=$((10000 + GITHUB_RUN_NUMBER)) assembleStaging bundleStaging

      - name: Verify staging package, version and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=apps/customer-web/android/app/build/outputs/apk/staging/app-staging.apk
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/staging-apk-signing.txt"
          "$SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.rstechnologies.gastrofood.staging'"
          echo "Verified staging APK package identity, signature presence and artifact existence."
          sha256sum "$APK" | tee "$RUNNER_TEMP/staging-apk-sha256.txt"

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo '## GastroFlow Food signed staging build' >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Android version code: $((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_STEP_SUMMARY"
          if test -s apps/customer-web/android/app/build/outputs/apk/staging/app-staging.apk; then
            echo 'Signed staging APK: generated and ready for approved device testing' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Signed staging APK: NOT generated' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify POS dependency lock still matches source
        run: sha256sum --check "$RUNNER_TEMP/pos-lock.sha256"

      - name: Upload signed staging APK
        uses: actions/upload-artifact@v4
        with:
          name: GastroFlow-Food-Staging-Signed-${{ github.run_number }}
          path: apps/customer-web/android/app/build/outputs/apk/staging/app-staging.apk
          if-no-files-found: error
          retention-days: 30

      - name: Save signed Food bundle for Play internal testing
        uses: actions/upload-artifact@v4
        with:
          name: GastroFlow-Food-Staging-Play-${{ github.run_number }}
          path: apps/customer-web/android/app/build/outputs/bundle/staging/*.aab
          if-no-files-found: error
          retention-days: 30

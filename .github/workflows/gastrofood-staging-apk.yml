name: GastroFlow Food Android staging APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/production-readiness
    paths:
      - .github/workflows/gastrofood-staging-apk.yml

permissions:
  contents: read

concurrency:
  group: gastrofood-staging-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Build GastroFlow Food staging APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_NATIVE_API_ORIGIN: https://gastroflow-staging.onrender.com
    steps:
      - name: Check out the approved branch
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub Ubuntu runners already provide Android SDK command-line tools.
      # Do not use android-actions/setup-android@v3 here: it invokes
      # "sdkmanager tools", a removed package, and fails before compilation.
      - name: Install Android API 36 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "Android SDK: ${ANDROID_HOME:-not-set}"
          command -v sdkmanager
          sdkmanager --version
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Install root dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Install isolated customer native dependencies
        working-directory: apps/customer-web
        run: npm ci --include=dev --no-audit --no-fund

      - name: Compile customer native interface and validate API target
        run: |
          npm run customer:native:build
          test -s apps/customer-web/dist/index.html
          if grep -R -q 'http://localhost:5000' apps/customer-web/dist/assets; then
            echo 'BLOCKED: native bundle references development API' >&2
            exit 1
          fi

      - name: Sync customer Android resources only
        working-directory: apps/customer-web
        run: |
          npm run native:sync:android
          npm run native:harden:android

      - name: Build test-only debug APK
        working-directory: apps/customer-web/android
        run: bash ./gradlew --no-daemon --stacktrace --console=plain assembleDebug

      - name: Verify APK exists
        run: test -s apps/customer-web/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build summary
        if: always()
        run: |
          echo '## GastroFlow Food Android staging build' >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if test -s apps/customer-web/android/app/build/outputs/apk/debug/app-debug.apk; then
            echo 'APK: generated successfully (debug signed)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'APK: NOT generated; inspect the first red failure step and stacktrace above' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload GastroFlow Food APK (test signing only)
        uses: actions/upload-artifact@v4
        with:
          name: GastroFlow-Food-Android-Staging-Debug
          path: apps/customer-web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

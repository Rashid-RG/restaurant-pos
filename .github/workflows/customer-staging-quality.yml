name: Customer app staging quality gate

on:
  push:
    branches:
      - codex/production-readiness
    paths:
      - 'apps/customer-web/**'
      - 'scripts/audit-customer-mobile-assets.mjs'
      - 'scripts/audit-gastrofood-native-readiness.mjs'
      - 'apps/customer-web/capacitor.config.json'
      - 'apps/customer-web/package.json'
      - 'apps/customer-web/package-lock.json'
      - 'scripts/check-food-native-project.mjs'
      - 'tests/customer-native-project-guard.test.js'
      - 'scripts/setup-food-native-location-permissions.mjs'
      - 'tests/customer-native-location-permissions.test.js'
      - 'scripts/harden-food-android.mjs'
      - 'tests/customer-native-android-hardening.test.js'
      - 'scripts/verify-food-native-lock.mjs'
      - 'tests/customer-native-lockfile.test.js'
      - 'package.json'
      - 'tests/customer-marketplace-availability.test.js'
      - 'tests/customer-auth-resilience.test.js'
      - 'tests/brevo-otp-email.test.js'
      - 'tests/customer-otp-purposes.test.js'
      - 'tests/customer-otp-phone-lookup.test.js'
      - 'tests/customer-native-android-secure-session.test.js'
      - 'tests/customer-native-ios-secure-session.test.js'
      - 'tests/customer-native-session-migration.test.js'
      - 'tests/customer-native-session-revalidation.test.js'
      - 'tests/customer-native-secure-session-diagnostic.test.js'
      - 'tests/customer-registration-validation.test.js'
      - 'tests/identity-registration-otp-tenant.test.js'
      - 'tests/customer-session-store.test.js'
      - 'lib/identity/customer-otp-login.js'
      - 'lib/otp-purposes.js'
      - 'routes/auth.js'
      - 'tests/customer-token-invalidation.test.js'
      - 'tests/customer-auth-tenant-lifecycle.test.js'
      - 'apps/customer-web/src/utils/customer-auth-scope.js'
      - 'apps/customer-web/src/utils/customer-token-invalidation.js'
      - 'tests/customer-contact-actions.test.js'
      - 'tests/customer-discovery-search.test.js'
      - 'tests/customer-menu-selection.test.js'
      - 'tests/customer-delivery-quote.test.js'
      - 'tests/customer-order-acknowledgement.test.js'
      - 'tests/customer-location-acquisition.test.js'
      - 'tests/customer-address-search-gate.test.js'
      - 'tests/customer-manual-address-save-guard.test.js'
      - 'tests/customer-native-api-origin.test.js'
      - 'tests/customer-native-react-dedupe.test.js'
      - 'tests/customer-native-reduced-motion-layout.test.js'
      - 'scripts/probe-food-native-cors.mjs'
      - 'tests/customer-native-cors-probe.test.js'
      - 'tests/customer-native-discovery-headers.test.js'
      - 'tests/customer-native-marketplace-timeout.test.js'
      - 'tests/customer-native-image-url.test.js'
      - 'apps/customer-web/src/utils/native-marketplace-timeout.js'
      - 'tests/customer-native-hosted-ux-isolation.test.js'
      - 'tests/customer-native-payment-policy.test.js'
      - 'tests/customer-native-origins.test.js'
      - 'lib/customer-cors-policy.js'
      - 'tests/customer-native-cors-express.test.js'
      - 'scripts/check-food-native-cors-config.mjs'
      - 'tests/customer-native-cors-release-gate.test.js'
      - 'server.js'
      - 'tests/customer-native-tracking-policy.test.js'
      - 'tests/customer-native-tracking-resume.test.js'
      - 'lib/customer-native-origins.js'
      - '.github/workflows/customer-staging-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Customer safety regression tests
        run: npx vitest run tests/customer-marketplace-availability.test.js tests/customer-auth-resilience.test.js tests/customer-token-invalidation.test.js tests/customer-auth-tenant-lifecycle.test.js tests/customer-contact-actions.test.js tests/customer-discovery-search.test.js tests/customer-menu-selection.test.js tests/customer-delivery-quote.test.js tests/customer-order-acknowledgement.test.js tests/customer-checkout-recovery-status.test.js tests/customer-checkout-submission-guard.test.js tests/customer-location-acquisition.test.js tests/customer-address-search-gate.test.js tests/customer-manual-address-save-guard.test.js tests/customer-native-api-origin.test.js tests/customer-native-react-dedupe.test.js tests/customer-native-reduced-motion-layout.test.js tests/customer-native-cors-probe.test.js tests/customer-native-discovery-headers.test.js tests/customer-native-marketplace-timeout.test.js tests/customer-native-image-url.test.js tests/customer-native-hosted-ux-isolation.test.js tests/customer-native-payment-policy.test.js tests/customer-native-origins.test.js tests/customer-native-cors-express.test.js tests/customer-native-cors-release-gate.test.js tests/customer-native-tracking-policy.test.js tests/customer-native-tracking-resume.test.js tests/customer-native-project-guard.test.js tests/customer-native-location-permissions.test.js tests/customer-native-android-hardening.test.js tests/customer-native-lockfile.test.js tests/brevo-otp-email.test.js tests/customer-otp-purposes.test.js tests/customer-otp-phone-lookup.test.js tests/customer-native-android-secure-session.test.js tests/customer-native-ios-secure-session.test.js tests/customer-native-session-migration.test.js tests/customer-native-session-revalidation.test.js tests/customer-native-secure-session-diagnostic.test.js tests/customer-registration-validation.test.js tests/identity-registration-otp-tenant.test.js tests/customer-session-store.test.js
      - name: Verify customer and driver mobile install assets
        run: npm run mobile:audit
      - name: Resolve customer-only native lock for CI verification
        working-directory: apps/customer-web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify resolved customer native lock consistency
        run: node scripts/verify-food-native-lock.mjs apps/customer-web/package.json apps/customer-web/package-lock.json
      - name: Check isolated GastroFood native identity and readiness blockers
        run: npm run food:native:preflight
      - name: Build POS, customer and driver apps
        run: npm run build:all
      - name: Verify customer native-mode web bundle (no deployment)
        env:
          VITE_NATIVE_API_ORIGIN: https://gastroflow-staging.onrender.com
        run: npm run customer:native:build

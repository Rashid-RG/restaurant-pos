name: GastroDriver native compilation candidates
on:
  push:
    branches: [codex/production-readiness]
    paths:
      - .github/workflows/driver-native-ci.yml
      - apps/driver-native/**
      - apps/driver-web/src/**
      - apps/driver-web/vite.config.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install POS web dependencies without changing root lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated native build tools
        run: npm install --prefix apps/driver-native --no-audit --no-fund
      - name: Build only GastroDriver app with staging HTTPS API
        env:
          VITE_DRIVER_NATIVE_API_URL: https://gastroflow-staging.onrender.com
          VITE_RIDER_PRESENCE_PILOT: "true"
        run: npx vite build apps/driver-web --mode native
      - name: Generate and sync isolated driver Android app
        working-directory: apps/driver-native
        run: |
          npx cap add android
          npx cap sync android
          test -f android/gradlew
          test -s android/app/src/main/assets/public/index.html
      - name: Add isolated GastroDriver Android background permissions
        run: node scripts/setup-driver-native-android-permissions.mjs
      - name: Build debug APK without release signing
        working-directory: apps/driver-native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gastrodriver-android-debug-candidate
          path: apps/driver-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install root web dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated driver native tooling
        run: npm install --prefix apps/driver-native --no-audit --no-fund
      - name: Build driver assets for staging
        env:
          VITE_DRIVER_NATIVE_API_URL: https://gastroflow-staging.onrender.com
          VITE_RIDER_PRESENCE_PILOT: "true"
        run: npx vite build apps/driver-web --mode native
      - name: Generate and sync isolated iPhone project
        working-directory: apps/driver-native
        run: |
          npx cap add ios
          npx cap sync ios
          test -f ios/App/App.xcodeproj/project.pbxproj
          test -s ios/App/App/public/index.html
      - name: Add background-location usage descriptions to simulator candidate
        working-directory: apps/driver-native
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string GastroDriver uses your location when you choose to share it during a delivery shift." ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string GastroDriver needs location while the screen is locked during an active delivery shift." ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" ios/App/App/Info.plist
      - name: Compile unsigned iOS simulator candidate
        working-directory: apps/driver-native
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/driver-ios-derived" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Archive simulator candidate
        run: |
          test -d "$RUNNER_TEMP/driver-ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          cd "$RUNNER_TEMP/driver-ios-derived/Build/Products/Debug-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/gastrodriver-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: gastrodriver-ios-simulator-candidate
          path: gastrodriver-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7

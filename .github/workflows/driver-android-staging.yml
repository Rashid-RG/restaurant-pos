name: GastroDriver signed Android staging
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    if: github.ref == 'refs/heads/codex/production-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install POS web dependencies without changing root lock
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated native build tools
        run: npm install --prefix apps/driver-native --no-audit --no-fund
      - name: Build only GastroDriver app with staging HTTPS API
        env:
          VITE_DRIVER_NATIVE_API_URL: https://gastroflow-staging.onrender.com
          VITE_RIDER_PRESENCE_PILOT: "true"
        run: npx vite build apps/driver-web --mode native
      - name: Generate and sync isolated driver Android app
        working-directory: apps/driver-native
        run: |
          npx cap add android
          npx cap sync android
          test -f android/gradlew
          test -s android/app/src/main/assets/public/index.html
      - name: Add isolated GastroDriver Android background permissions
        run: node scripts/setup-driver-native-android-permissions.mjs
      - name: Configure independently installable driver beta
        working-directory: apps/driver-native/android
        run: |
          cat >> app/build.gradle <<'GRADLE'

          android {
              defaultConfig {
                  applicationId 'com.rstechnologies.gastrodriver.staging'
                  versionCode (10000 + Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER')))
                  versionName "1.0-staging"
              }
              signingConfigs {
                  staging {
                      storeFile file(System.getenv('RUNNER_TEMP') + '/driver-staging.jks')
                      storePassword System.getenv('STAGING_STORE_PASSWORD')
                      keyAlias System.getenv('STAGING_KEY_ALIAS')
                      keyPassword System.getenv('STAGING_KEY_PASSWORD')
                  }
              }
              buildTypes.release.signingConfig = signingConfigs.staging
          }
          GRADLE
      - name: Build and verify signed driver APK and Play bundle
        working-directory: apps/driver-native/android
        env:
          STAGING_KEYSTORE_BASE64: ${{ secrets.FOOD_STAGING_KEYSTORE_BASE64 }}
          STAGING_STORE_PASSWORD: ${{ secrets.FOOD_STAGING_STORE_PASSWORD }}
          STAGING_KEY_ALIAS: ${{ secrets.FOOD_STAGING_KEY_ALIAS }}
          STAGING_KEY_PASSWORD: ${{ secrets.FOOD_STAGING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/driver-staging.jks"' EXIT
          printf '%s' "${STAGING_KEYSTORE_BASE64:?Missing staging signing key}" | base64 -d > "$RUNNER_TEMP/driver-staging.jks"
          unset STAGING_KEYSTORE_BASE64
          bash gradlew assembleRelease bundleRelease --no-daemon
          apk=app/build/outputs/apk/release/app-release.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/driver-badging.txt"
          grep -F "package: name='com.rstechnologies.gastrodriver.staging'" "$RUNNER_TEMP/driver-badging.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: GastroDriver-Staging-Signed-${{ github.run_number }}
          path: apps/driver-native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: GastroDriver-Staging-Play-${{ github.run_number }}
          path: apps/driver-native/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

name: Generate GastroFlow Email Logo

on:
  push:
    branches: [codex/production-readiness]
    paths:
      - '.github/workflows/gastroflow-email-logo.yml'
      - 'public/gastroflow-brand.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render email-safe wordmark PNG from existing GastroFlow identity
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg
          from PIL import Image
          from io import BytesIO
          png = cairosvg.svg2png(url='public/gastroflow-brand.svg',output_width=840,output_height=216)
          image = Image.open(BytesIO(png)).convert('RGBA')
          image.save('public/gastroflow-email-logo.png',optimize=True)
          PY
      - name: Commit only the generated logo asset to staging
        run: |
          git config user.name "GastroFlow Asset Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/gastroflow-email-logo.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(email): publish PNG of GastroFlow platform wordmark"
            git push origin HEAD:codex/production-readiness
          fi

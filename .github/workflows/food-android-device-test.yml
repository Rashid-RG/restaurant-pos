name: GastroFlow Food Android device test

# Explicit release approval. Do not publish on every code push.
on:
  workflow_dispatch:
  push:
    branches: [codex/production-readiness]
    paths:
      - .github/workflows/food-android-device-test.yml
      - apps/customer-web/src/**
      - shared/ui/**

permissions:
  contents: read

concurrency:
  group: gastrofood-device-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    if: github.ref == 'refs/heads/codex/production-readiness'
    name: Build isolated Food device test APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_NATIVE_API_ORIGIN: https://gastroflow-staging.onrender.com
    steps:
      - name: Check out the approved branch
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub Ubuntu runners already provide Android SDK command-line tools.
      # Do not use android-actions/setup-android@v3 here: it invokes
      # "sdkmanager tools", a removed package, and fails before compilation.
      - name: Install Android API 36 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "Android SDK: ${ANDROID_HOME:-not-set}"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" "$SDK_ROOT/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then echo "::error::Android SDK manager not found in $SDK_ROOT"; exit 1; fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Record protected POS lockfile checksum
        run: sha256sum package-lock.json > "$RUNNER_TEMP/pos-lock.sha256"

      - name: Install root dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Install isolated customer native dependencies
        working-directory: apps/customer-web
        run: npm ci --include=dev --no-audit --no-fund

      - name: Audit native customer release boundaries
        run: |
          node scripts/check-food-native-release-boundary.mjs
          node scripts/verify-food-native-lock.mjs apps/customer-web/package.json apps/customer-web/package-lock.json

      - name: Compile customer native interface and validate API target
        run: |
          npm run customer:native:build
          test -s apps/customer-web/dist/index.html
          if grep -R -q 'http://localhost:5000' apps/customer-web/dist/assets; then
            echo 'BLOCKED: native bundle references development API' >&2
            exit 1
          fi

      - name: Sync customer Android resources only
        working-directory: apps/customer-web
        run: |
          npm run native:sync:android
          npm run native:harden:android


      - name: Build isolated device-test APK
        working-directory: apps/customer-web/android
        run: |
          set -euo pipefail
          cat >> app/build.gradle <<'GRADLE'

          android.buildTypes.debug {
              applicationIdSuffix '.devicetest'
              manifestPlaceholders = [appLabel: 'GastroFlow Food Test']
          }
          GRADLE
          bash gradlew assembleDebug --no-daemon -PfoodStagingVersionCode=$((10000 + GITHUB_RUN_NUMBER))
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/device-test-badging.txt"
          grep -F "package: name='com.rstechnologies.gastrofood.devicetest'" "$RUNNER_TEMP/device-test-badging.txt"
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: GastroFlow-Food-Android-Device-Test
          path: apps/customer-web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

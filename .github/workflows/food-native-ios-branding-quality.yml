name: GastroFlow Food iOS branding generator quality

# Lightweight Linux tests only; does not build iOS, use macOS, sign or deploy.
on:
  push:
    branches:
      - codex/production-readiness
    paths:
      - 'scripts/generate-food-ios-branding.py'
      - 'tests/test_food_ios_branding.py'
      - '.github/workflows/food-native-ios-branding-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-asset-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image-test dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Test catalog preservation, 1024px opacity and source isolation
        run: python -m unittest discover -s tests -p test_food_ios_branding.py -v

name: Verify
on:
  pull_request:
  push:
    branches: [main, codex/production-readiness]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:all
      - run: node scripts/production-smoke.js

  # Only an explicitly tagged commit on the customer development branch
  # invokes the reusable macOS simulator workflow. No deployment or signing.
  ios-native-simulator:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/production-readiness' && contains(github.event.head_commit.message, '[verify-ios-simulator]')
    uses: ./.github/workflows/food-native-ios-simulator.yml
    permissions:
      contents: read

  gastrodriver-android-candidate:
    if: (github.event_name == 'pull_request' && github.head_ref == 'codex/production-readiness') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/production-readiness' && contains(github.event.head_commit.message, '[verify-driver-native]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated native dependencies
        run: npm install --prefix apps/driver-native --no-audit --no-fund
      - name: Compile native-mode GastroDriver assets
        env:
          VITE_DRIVER_NATIVE_API_URL: https://gastroflow-staging.onrender.com
          VITE_RIDER_PRESENCE_PILOT: "true"
        run: npx vite build apps/driver-web --mode native
      - name: Generate Android and configure background-location permissions
        run: |
          cd apps/driver-native
          npx cap add android
          npx cap sync android
          cd ../..
          node scripts/setup-driver-native-android-permissions.mjs
      - name: Compile Android debug APK
        working-directory: apps/driver-native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload unsigned-for-release Android debug candidate
        uses: actions/upload-artifact@v4
        with:
          name: gastrodriver-android-debug-candidate
          path: apps/driver-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  gastrodriver-ios-candidate:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/production-readiness'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install root frontend packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install isolated driver native packages
        run: npm install --prefix apps/driver-native --no-audit --no-fund
      - name: Build native-mode GastroDriver frontend
        env:
          VITE_DRIVER_NATIVE_API_URL: https://gastroflow-staging.onrender.com
          VITE_RIDER_PRESENCE_PILOT: "true"
        run: npx vite build apps/driver-web --mode native
      - name: Generate isolated iOS source
        working-directory: apps/driver-native
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Configure iOS rider consent and background-location purpose
        working-directory: apps/driver-native
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string GastroDriver uses your location only when you start location sharing during a shift." ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string GastroDriver tracks active deliveries while your iPhone is locked when you allow background location." ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" ios/App/App/Info.plist
      - name: Compile unsigned iPhone simulator app
        working-directory: apps/driver-native
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/driver-ios-derived" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Archive simulator candidate
        run: |
          test -d "$RUNNER_TEMP/driver-ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          cd "$RUNNER_TEMP/driver-ios-derived/Build/Products/Debug-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/gastrodriver-ios-simulator.zip"
      - name: Upload unsigned simulator app
        uses: actions/upload-artifact@v4
        with:
          name: gastrodriver-ios-simulator-candidate
          path: gastrodriver-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7

services:
  gastroflow-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_FILE: /app/data/restaurant.db
      JWT_SECRET: ${JWT_SECRET:?Set a strong JWT_SECRET in .env or the deployment secret manager}
      CUSTOMER_JWT_SECRET: ${CUSTOMER_JWT_SECRET:?Set a strong CUSTOMER_JWT_SECRET in .env or the deployment secret manager}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set the initial administrator username}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong initial administrator password}
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID:?Set the PayHere merchant ID}
      PAYHERE_MERCHANT_SECRET: ${PAYHERE_MERCHANT_SECRET:?Set the PayHere merchant secret}
      PAYHERE_NOTIFY_URL: ${PAYHERE_NOTIFY_URL:?Set the public PayHere notification URL}
      PAYHERE_SANDBOX: ${PAYHERE_SANDBOX:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set the approved application origins}
    volumes:
      - gastroflow_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gastroflow-app:
        condition: service_healthy

volumes:
  gastroflow_data:
